name: Desktop · Windows artifacts

# Manual trigger only. Dispatch it from the Actions tab (or `gh workflow run`)
# and it produces the two Windows deliverables the desktop shell ships:
#
#   Oh-My-Pi-Desktop-Setup-<version>-x64.exe      NSIS installer
#   Oh-My-Pi-Desktop-Portable-<version>-x64.exe   single-file executable
#
# plus the unpacked app directory, so a broken artifact can be inspected
# without reinstalling anything.
#
# The bundled runtime is the real upstream release binary (`omp-windows-x64.exe`
# from github.com/can1357/oh-my-pi/releases), verified against the release's
# SHA256SUMS.txt before packaging. Set `omp_version` to pin a tag.

# Two ways in: dispatch it by hand (Actions tab or `gh workflow run`), or let a
# push to main that touches the desktop sources build the artifacts for you.
on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "desktop-shell/**"
      - "resources/**"
      - "scripts/**"
      - "electron-builder.yml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop-windows.yml"
  workflow_dispatch:
    inputs:
      omp_version:
        description: "oh-my-pi release tag for the bundled omp runtime (e.g. v18.7.0, or 'latest')"
        required: false
        default: "latest"
        type: string
      # Pushes reuse the same defaults; `inputs.*` is empty for them, hence the
      # `|| 'latest'` fallbacks below.
      release:
        description: "Publish the artifacts as a GitHub Release in this repository"
        required: false
        default: false
        type: boolean
      smoke_test:
        description: "Boot the packaged app on this runner and run its self-test"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

# One packaging run per branch. A newer push supersedes the older run instead of
# queueing behind it, so a wedged GUI step can never block the next build.
concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows installer + portable exe
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # electron-builder must never publish on its own; releases are opt-in below.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      OMP_RUNTIME_VERSION: ${{ inputs.omp_version || 'latest' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Report the toolchain
        shell: bash
        run: |
          bun --version
          node --version
          echo "runner: ${{ runner.os }} / ${{ runner.arch }}"

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build icons
        shell: bash
        run: bun run icons

      - name: Fetch the upstream omp runtime for Windows
        shell: bash
        run: bun run desktop:runtime:win

      - name: Typecheck
        shell: bash
        run: bun run typecheck

      - name: Build the renderer bundle
        shell: bash
        run: bun run build

      - name: Package the Windows artifacts
        shell: bash
        run: bun run desktop:dist:win

      - name: List the artifacts
        shell: bash
        run: |
          ls -la release
          echo "--- installer/portable ---"
          ls -la release/*.exe

      # Artifacts are uploaded before the smoke test on purpose: the exe and the
      # installer exist at this point, and a headless runner is the least
      # reliable place to boot a GUI app.
      - name: Upload the installer and portable exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omp-desktop-windows-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Upload the unpacked app directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omp-desktop-windows-unpacked-${{ github.run_number }}
          path: release/win-unpacked/**
          if-no-files-found: warn
          retention-days: 14

      # Boot the packaged app on this runner and let it self-test: resolve the
      # bundled omp.exe, handshake over RPC, classify the entry points, run one
      # one-shot request, probe the DOM. Software rendering, bounded wait, and
      # the report decides pass or fail.
      - name: Self-test the packaged app
        if: ${{ inputs.smoke_test || github.event_name == 'push' }}
        id: smoke
        timeout-minutes: 8
        shell: bash
        env:
          OMP_DESKTOP_VERIFY: "1"
          OMP_DESKTOP_VERIFY_OUT: ${{ github.workspace }}\verify-output
          # The real 236 MB release binary starts cold on a fresh runner, so the
          # handshake and the whole self-test get generous budgets. A runtime that
          # dies is caught by the exit race, not by these numbers.
          OMP_DESKTOP_READY_TIMEOUT: "60000"
          OMP_DESKTOP_VERIFY_TIMEOUT: "300000"
          OMP_DESKTOP_VERBOSE: "1"
          # omp refuses to open a session with no model configured, and a runner
          # has no real credentials. This placeholder satisfies that startup gate
          # so the smoke test drives what it is meant to drive: the bundled
          # `omp.exe` resolving, its `ready` frame, protocol v2 negotiation and the
          # real command surface. No provider call is expected to succeed — the
          # one-off prompt records that as a note instead of a failure.
          ANTHROPIC_API_KEY: "ci-placeholder-not-a-real-key"
        run: |
          set -o pipefail
          APP="release/win-unpacked/Oh My Pi Desktop.exe"
          test -f "$APP" || { echo "packaged app missing at $APP"; ls release/win-unpacked | head -40; exit 1; }

          # The app is a GUI process: launch it detached, poll for the report it
          # writes, then tear down the whole process tree. Never `wait` on it and
          # never run it in the foreground, or this step hangs until the runner
          # kills it.
          rm -f verify-output/report.json
          "$APP" --disable-gpu --no-sandbox > smoke.log 2>&1 &
          APP_PID=$!
          for _ in $(seq 1 60); do
            [ -f verify-output/report.json ] && break
            sleep 5
          done
          cmd //c "taskkill /F /T /PID $APP_PID" >/dev/null 2>&1 || kill -9 "$APP_PID" 2>/dev/null || true
          sleep 2

          echo "=== smoke log ==="
          tail -40 smoke.log || true
          echo "=== report ==="
          cat verify-output/report.json || { echo "the packaged app wrote no verify report within the wait window"; exit 1; }
          node -e "const r=require('./verify-output/report.json'); console.log('ok:', r.ok, 'packaged:', r.packaged, 'failures:', JSON.stringify(r.failures)); if(!r.ok) process.exit(1)"

      - name: Upload the self-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omp-desktop-windows-selftest-${{ github.run_number }}
          path: verify-output/**
          if-no-files-found: warn
          retention-days: 14

      - name: Publish a GitHub Release
        if: ${{ inputs.release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="desktop-v$(node -p "require('./package.json').version")-build.${{ github.run_number }}"
          gh release create "$tag" \
            --title "Oh My Pi Desktop $tag" \
            --notes "Windows build from ${{ github.event_name }} (run ${{ github.run_number }}). Bundled omp runtime: ${{ inputs.omp_version || 'latest' }}. Installer and portable executable attached." \
            release/*.exe
          echo "released $tag"
